<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkforceConnect Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 620px;
            margin: 60px auto;
            padding: 0 20px;
            background: #f4f4f4;
        }

        h1 {
            color: #1a3a5c;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            background: #1a3a5c;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<h1>WorkforceConnect Registration</h1>

{% if message %}
<div class="message">{{ message }}</div>
{% endif %}

<form method="POST">

    <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" required>
    </div>

    <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" required>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
    </div>

    <div class="form-group">
        <label>City</label>
        <input type="text" name="city" required>
    </div>

    <div class="form-group">
        <label>State</label>
        <input type="text" name="state" required>
    </div>

    <button type="submit">Submit Registration</button>

</form>

</body>
</html>
